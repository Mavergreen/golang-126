name: repackage-on-ingredient-bump

# A bumped build ingredient (the Recaulk pin, the CA bundle) dispatches a -mavericks.(N+1) repackage
# through the shared reusable workflow; release.yml's workflow_dispatch local_release path cuts and
# publishes it. The Go version (own upstream, UPSTREAM_VERSION) is release.yml's N=1 path on push to main.

on:
  push:
    branches: [main]
    paths:
      - components/recaulk/version
      - build/versions.sh    # the CA bundle's hash pin
      - vendor/cacert.pem    # the vendored CA bundle itself (refreshed by hand; see INGREDIENTS.md)

jobs:
  repackage:
    permissions:
      actions: write
    uses: Mavergreen/shipyard/.github/workflows/repackage-on-ingredient-bump.yml@v1
    with:
      own-upstream-paths: UPSTREAM_VERSION
